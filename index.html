<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أَثَر | النسخة الكاملة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
        :root { --p: #1a2a3a; --a: #c5a059; --bg: #f4f7f9; --w: #ffffff; --g: #27ae60; --r: #c0392b; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; color: var(--p); text-align: center; transition: 0.5s; }
        .header { background: var(--p); color: white; padding: 10px 20px; border-bottom: 4px solid var(--a); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 1000; }
        .coins-display { font-weight: 800; color: var(--a); background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 12px; border: 1px solid var(--a); }
        .shop-icon { background: var(--a); color: var(--p); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card { background: var(--w); max-width: 500px; margin: 25px auto; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); position: relative; border: 1px solid #eee; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit; background: white; color: var(--p); }
        .btn:hover { border-color: var(--a); background: #fffdf5; transform: translateY(-2px); }
        .btn-p { background: var(--p); color: var(--a); border: none; }
        .btn-back { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
        .hidden { display: none !important; }
        .timer-bg { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #bar { height: 100%; background: var(--a); width: 100%; transition: 0.1s linear; }
        .shop-grid { display: grid; gap: 10px; margin-top: 15px; }
        .shop-item { background: #f9f9f9; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .buy-btn { background: var(--p); color: var(--a); border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 800; }
        .score-row { display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: 800; color: var(--a); }
        .correct { border-color: var(--g) !important; background: #eafff2 !important; color: var(--g); }
        .wrong { border-color: var(--r) !important; background: #fff0f0 !important; color: var(--r); }
        footer { font-size: 12px; color: #aaa; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="coins-display">💰 <span id="pts-val">0</span> <small id="rank-tag"></small></div>
        <h2 style="margin:0; font-size: 22px;">أَثَر</h2>
        <div class="shop-icon" onclick="showScreen('scr-shop')">🛒</div>
    </div>

    <div id="scr-home" class="card">
        <h3>مرحباً بك في أَثَر</h3>
        <p>موسوعة العقيدة والسيرة النبوية</p>
        <button class="btn btn-p" onclick="showScreen('scr-modes')">🎮 ابدأ اللعب</button>
        <button class="btn" onclick="showScreen('scr-shop')">🛒 المتجر الملكي</button>
        <p style="font-size: 11px; color: #999;">تصميم: محمد خير أبو بلال</p>
    </div>

    <div id="scr-modes" class="card hidden">
        <h3>اختر طور اللعب</h3>
        <button class="btn" onclick="setMode('solo')">👤 لاعب واحد</button>
        <button class="btn" onclick="setMode('group')">👥 لاعبان (تحدي)</button>
        <button class="btn-back" onclick="showScreen('scr-home')">🔙 رجوع</button>
    </div>

    <div id="scr-levels" class="card hidden">
        <h3>اختر القسم</h3>
        <button class="btn" style="border-right: 6px solid #2980b9" onclick="startGame('aq')">⭐ العقيدة</button>
        <button class="btn" style="border-right: 6px solid var(--g)" onclick="startGame('ez')">🌱 السيرة (سهل)</button>
        <button class="btn" style="border-right: 6px solid var(--a)" onclick="startGame('md')">⚡ السيرة (متوسط)</button>
        <button class="btn" style="border-right: 6px solid var(--r)" onclick="startGame('hd')">🔥 السيرة (صعب)</button>
        <button class="btn-back" onclick="showScreen('scr-modes')">🔙 رجوع</button>
    </div>

    <div id="scr-shop" class="card hidden">
        <h3 style="color:var(--a)">🛒 المتجر</h3>
        <div class="shop-grid">
            <div class="shop-item"><span>❄️ تجميد الوقت</span><button class="buy-btn" onclick="buyItem('freeze', 100)">100pt</button></div>
            <div class="shop-item"><span>✂️ حذف إجابتين</span><button class="buy-btn" onclick="buyItem('half', 200)">200pt</button></div>
            <div class="shop-item"><span>👑 لقب الملك</span><button class="buy-btn" onclick="buyItem('rank', 1000)">1000pt</button></div>
        </div>
        <button class="btn-back" onclick="showScreen('scr-home')">🔙 رجوع</button>
    </div>

    <div id="scr-game" class="card hidden">
        <div id="group-ui" class="hidden">
            <div id="current-player" style="font-weight:800; color:var(--p); margin-bottom:5px;"></div>
            <div class="score-row"><div>P1: <span id="sc1">0</span></div><div>P2: <span id="sc2">0</span></div></div>
        </div>
        <div class="timer-bg"><div id="bar"></div></div>
        <h3 id="question-text" style="min-height:80px;"></h3>
        <div id="options-container"></div>
        <button class="btn" id="half-helper" style="display:none; background:#eee;" onclick="useHalfHelp()">استخدام حذف إجابتين ✂️</button>
        <button class="btn-back" onclick="exitGame()">🏳️ انسحاب</button>
    </div>

    <footer>حقوق البرمجة: محمد خير أبو بلال © 2026</footer>

    <script>
        const QUESTIONS_DB = {
            aq: [
                {q:"ما هو الركن الأول من أركان الإيمان؟", a:"الإيمان بالله", w:["الإيمان بالكتب","الإيمان بالرسل","الإيمان بالقدر"]},
                {q:"ما معنى توحيد الربوبية؟", a:"إفراد الله بأفعاله كالخلق والرزق", w:["إفراد الله بالعبادة","إثبات الأسماء والصفات","محبة الله"]},
                {q:"أين الله عز وجل كما ورد في القرآن؟", a:"في السماء على العرش استوى", w:["في كل مكان بذاته","لا مكان له","في الأرض"]},
                {q:"ما هي الكلمة التي هي مفتاح الجنة؟", a:"لا إله إلا الله", w:["الحمد لله","سبحان الله","الله أكبر"]},
                {q:"كم عدد أركان الإيمان؟", a:"6 أركان", w:["5 أركان","7 أركان","4 أركان"]},
                {q:"من هو الملك الموكل بالوحي؟", a:"جبريل عليه السلام", w:["ميكائيل","إسرافيل","مالك"]},
                {q:"الإيمان بالقدر هو الركن رقم كم؟", a:"السادس", w:["الخامس","الأول","الثالث"]},
                {q:"ما هو الشرك الأكبر؟", a:"صرف العبادة لغير الله", w:["الرياء","الحلف بغير الله","الكذب"]},
                {q:"من هم الملائكة؟", a:"عباد خلقوا من نور", w:["بشر صالحون","خلقوا من نار","جان"]},
                {q:"ما هي أعظم سورة في القرآن؟", a:"الفاتحة", w:["البقرة","الإخلاص","يس"]}
            ],
            ez: [
                {q:"من هو نبي الإسلام؟", a:"محمد ﷺ", w:["إبراهيم","موسى","عيسى"]},
                {q:"أين ولد النبي ﷺ؟", a:"مكة المكرمة", w:["المدينة المنورة","الطائف","جدة"]},
                {q:"ما اسم والد النبي ﷺ؟", a:"عبد الله", w:["أبو طالب","عبد المطلب","حمزة"]},
                {q:"كم كان عمر النبي حين بعث؟", a:"40 سنة", w:["25 سنة","30 سنة","50 سنة"]},
                {q:"ما اسم مرضعة النبي ﷺ؟", a:"حليمة السعدية", w:["ثويبة","آمنة","خديجة"]},
                {q:"إلى أين كانت الهجرة الأولى؟", a:"الحبشة", w:["المدينة","الطائف","خيبر"]},
                {q:"ما اسم غار الذي نزل فيه الوحي؟", a:"حراء", w:["ثور","أحد","تبوك"]},
                {q:"كم عدد أولاد النبي الذكور؟", a:"3", w:["2","4","1"]},
                {q:"في أي شهر ولد النبي ﷺ؟", a:"ربيع الأول", w:["رمضان","شوال","رجب"]},
                {q:"ما هي كنية النبي ﷺ؟", a:"أبو القاسم", w:["أبو إبراهيم","أبو محمد","أبو بكر"]}
            ],
            md: [
                {q:"ما اسم ناقة الرسول ﷺ؟", a:"القصواء", w:["العضباء","الورقاء","الشهباء"]},
                {q:"في أي سنة كانت غزوة بدر؟", a:"2 هـ", w:["3 هـ","1 هـ","5 هـ"]},
                {q:"من هو رفيق النبي في الهجرة؟", a:"أبو بكر الصديق", w:["عمر بن الخطاب","علي بن أبي طالب","عثمان"]},
                {q:"ما هي أول صلاة فرضت؟", a:"الظهر", w:["الفجر","العصر","العشاء"]},
                {q:"كم عدد غزوات النبي ﷺ؟", a:"27 غزوة", w:["15 غزوة","10 غزوات","50 غزوة"]},
                {q:"ما هي السورة التي تسمى عروس القرآن؟", a:"الرحمن", w:["يس","الملك","الواقعة"]},
                {q:"من هو أسد الله؟", a:"حمزة بن عبد المطلب", w:["خالد بن الوليد","علي بن أبي طالب","عمر"]},
                {q:"ما اسم زوجة النبي الأولى؟", a:"خديجة بنت خويلد", w:["عائشة","حفصة","زينب"]},
                {q:"كم استمرت الدعوة في مكة؟", a:"13 سنة", w:["10 سنوات","23 سنة","5 سنوات"]},
                {q:"ما هو المسجد الذي أسس على التقوى؟", a:"قباء", w:["المسجد الحرام","المسجد النبوي","الأقصى"]}
            ],
            hd: [
                {q:"من هو الصحابي الذي اهتز لموته العرش؟", a:"سعد بن معاذ", w:["حمزة","جعفر الطيار","مصعب بن عمير"]},
                {q:"ما هي السورة التي تسمى الفاضحة؟", a:"التوبة", w:["المنافقون","الأحزاب","الفتح"]},
                {q:"من هو ترجمان القرآن؟", a:"عبد الله بن عباس", w:["عبد الله بن مسعود","معاذ بن جبل","أبي بن كعب"]},
                {q:"في أي غزوة كُسرت بيضة النبي ﷺ؟", a:"أحد", w:["الخندق","خيبر","حنين"]},
                {q:"من هو الصحابي الذي تستحي منه الملائكة؟", a:"عثمان بن عفان", w:["أبو بكر","عمر","علي"]},
                {q:"ما اسم السيف الذي أهداه النبي لعلي؟", a:"ذو الفقار", w:["البتار","الصارم","الحسام"]},
                {q:"كم عدد التكبيرات في صلاة الجنازة؟", a:"4", w:["5","3","7"]},
                {q:"من هي الملقبة بذات النطاقين؟", a:"أسماء بنت أبي بكر", w:["عائشة","فاطمة","خديجة"]},
                {q:"من هو الصحابي الذي لُقب بذي النورين؟", a:"عثمان بن عفان", w:["علي","عمر","أبو عبيدة"]},
                {q:"ما هي آخر آية نزلت في القرآن؟", a:"واتقوا يوماً ترجعون فيه إلى الله", w:["اليوم أكملت لكم دينكم","إذا جاء نصر الله","قل هو الله أحد"]}
            ]
        };

        let points = parseInt(localStorage.getItem('athar_pts')) || 0;
        let gameMode = 'solo', currentPlayer = 1, scores = {1:0, 2:0}, pool = [], timer, isActive = true, currentQ;
        let powerFrozen = false, powerHalf = false;

        function showScreen(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updatePoints() {
            document.getElementById('pts-val').innerText = points;
            localStorage.setItem('athar_pts', points);
            if(localStorage.getItem('athar_king')) document.getElementById('rank-tag').innerText = "| الملك 👑";
        }
        updatePoints();

        function buyItem(item, cost) {
            if(points >= cost) {
                points -= cost; updatePoints();
                if(item==='freeze') powerFrozen=true;
                if(item==='half') powerHalf=true;
                if(item==='rank') localStorage.setItem('athar_king', '1');
                updatePoints(); alert('تم الشراء بنجاح!');
            } else alert('نقاطك لا تكفي!');
        }

        function setMode(m) { gameMode = m; showScreen('scr-levels'); }

        function startGame(lvl) {
            pool = [...QUESTIONS_DB[lvl]]; scores = {1:0, 2:0}; currentPlayer = 1;
            showScreen('scr-game');
            if(gameMode === 'group') document.getElementById('group-ui').classList.remove('hidden');
            else document.getElementById('group-ui').classList.add('hidden');
            loadNext();
        }

        function useHalfHelp() {
            if(!powerHalf) return; powerHalf = false;
            document.getElementById('half-helper').style.display = 'none';
            let btns = Array.from(document.querySelectorAll('#options-container .btn'));
            let removed = 0;
            btns.forEach(b => { if(b.innerText !== currentQ.a && removed < 2) { b.style.visibility = 'hidden'; removed++; } });
        }

        function loadNext() {
            if(timer) clearInterval(timer); isActive = true;
            if(pool.length === 0) { 
                alert("انتهى القسم!"); 
                points += scores[1] + scores[2]; updatePoints();
                showScreen('scr-home'); return; 
            }
            document.getElementById('half-helper').style.display = powerHalf ? 'block' : 'none';
            document.getElementById('current-player').innerText = `دور اللاعب ${currentPlayer}`;
            document.getElementById('sc1').innerText = scores[1];
            document.getElementById('sc2').innerText = scores[2];
            currentQ = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
            let options = [currentQ.a, ...currentQ.w].sort(() => Math.random() - 0.5);
            document.getElementById('question-text').innerText = currentQ.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            options.forEach(opt => {
                const b = document.createElement('button'); b.className = "btn"; b.innerText = opt;
                b.onclick = () => {
                    if(!isActive) return; isActive = false;
                    if(opt === currentQ.a) { scores[currentPlayer] += 20; b.classList.add('correct'); }
                    else b.classList.add('wrong');
                    if(gameMode === 'group') currentPlayer = (currentPlayer === 1) ? 2 : 1;
                    setTimeout(loadNext, 1000);
                };
                container.appendChild(b);
            });
            if(!powerFrozen) {
                let w = 100;
                timer = setInterval(() => { w -= 2; document.getElementById('bar').style.width = w + "%"; if(w <= 0) { clearInterval(timer); loadNext(); } }, 200);
            } else { document.getElementById('bar').style.width = "100%"; powerFrozen = false; }
        }

        function exitGame() { if(confirm("رجوع؟")) { if(timer) clearInterval(timer); showScreen('scr-home'); } }
    </script>
</body>
</html>
